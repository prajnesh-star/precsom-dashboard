const RELOCK = "<script>\n(function(){\n  var LIMIT = 10*60*1000;\n  var unlockedAt = Date.now();\n  function expired(){ return Date.now() - unlockedAt > LIMIT; }\n  function lock(){ location.reload(); }\n  setInterval(function(){ if(expired()) lock(); }, 5000);\n  document.addEventListener('visibilitychange', function(){ if(!document.hidden && expired()) lock(); });\n})();\n<\/script>";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryUnlock(pw){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(P.salt), iterations:310000, hash:'SHA-256'},
    km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
  const ds = new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'));
  return await new Response(ds).text();
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const html = await tryUnlock(document.getElementById('pw').value);
    document.open(); document.write(html + RELOCK); document.close();
  } catch(ex) {
    btn.disabled = false;
    err.textContent = 'Wrong password — try again.';
  }
});
