<style>
 :root{--bg:#F6F5F8;--card:#fff;--ink:#1D1A25;--ink2:#57516A;--ink3:#8A8398;
       --hair:#E3E0EA;--accent:#6B44A8;--bad:#A93227}
 @media(prefers-color-scheme:dark){:root{--bg:#100E15;--card:#191620;--ink:#EDEAF3;
       --ink2:#ABA4BA;--ink3:#7B748A;--hair:#292434;--accent:#AC8EE0;--bad:#E8887E}}
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
      font-family:"IBM Plex Sans",system-ui,sans-serif;
      display:flex;align-items:center;justify-content:center;padding:24px}
 .box{background:var(--card);border:1px solid var(--hair);border-radius:14px;
      padding:30px 30px 26px;width:100%;max-width:352px;text-align:center}
 h1{margin:0 0 4px;font-size:18px;font-weight:600;letter-spacing:-.01em}
 p{margin:0 0 20px;font-size:12.5px;color:var(--ink2)}
 input{width:100%;font:inherit;font-size:15px;padding:11px 13px;text-align:center;
       border:1px solid var(--hair);border-radius:9px;background:var(--bg);
       color:var(--ink);letter-spacing:.06em}
 input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
 button{margin-top:11px;width:100%;font:inherit;font-size:13px;font-weight:500;
        padding:11px;border:0;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer}
 button:disabled{opacity:.55;cursor:default}
 .err{margin-top:12px;font-size:12px;color:var(--bad);min-height:16px}
 .ft{margin-top:18px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
     letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
</style></head><body>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'), err=document.getElementById('err');
  btn.disabled=true; err.textContent=''; btn.textContent='Unlocking…';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),
      'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b(P.salt),iterations:310000,hash:'SHA-256'},km,
      {name:'AES-GCM',length:256},false,['decrypt']);
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.iv)},key,b(P.ct));
    const html=await new Response(new Blob([buf]).stream()
      .pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  }catch(_){
    err.textContent='Wrong password.'; btn.disabled=false; btn.textContent='Unlock';
    document.getElementById('pw').select();
  }
});
