<meta charset="utf-8">

<title>Squad Whereabouts</title>
<style>
  :root{--bg:#EEF1EF;--card:#FCFDFC;--ink:#152119;--ink3:#6F8077;
        --hair:#D6DEDA;--acc:#0E4C6B}
  @media (prefers-color-scheme:dark){:root{--bg:#0D1512;--card:#16201C;--ink:#E5EEE9;
        --ink3:#78897F;--hair:#253028;--acc:#6FB8DA}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  .card{background:var(--card);border:1px solid var(--hair);border-radius:16px;
        padding:34px 36px;width:min(360px,90vw);
        box-shadow:0 2px 4px rgba(0,0,0,.05),0 14px 40px rgba(0,0,0,.10)}
  h1{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
  p{margin:0 0 20px;font-size:13px;color:var(--ink3)}
  input{width:100%;font-size:15px;padding:11px 13px;border-radius:9px;
        border:1px solid var(--hair);background:transparent;color:var(--ink);outline:none}
  input:focus{border-color:var(--acc)}
  button{width:100%;margin-top:11px;font-size:14px;font-weight:600;padding:11px;
         border-radius:9px;border:none;background:var(--acc);color:#fff;cursor:pointer}
  button:disabled{opacity:.6}
  .err{min-height:18px;margin-top:9px;font-size:12.5px;color:#A8351F}
  @media (prefers-color-scheme:dark){.err{color:#E8887E}}
</style></head><body>

</form>

    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),

    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b(P.salt),iterations:310000,hash:'SHA-256'},km,
